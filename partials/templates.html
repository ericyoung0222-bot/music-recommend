<!--
  =====================================================================
  컴포넌트 템플릿 모음
  - JS는 이 파일의 <template data-template="이름">을 복사해서 화면에 붙이고,
    data-js가 붙은 자리에 글자/이미지/링크만 채워 넣습니다.
  - 디자이너는 class, 태그 구조, 고정 문구를 자유롭게 바꿔도 됩니다.
  - ⚠️ data-template, data-js, data-score 속성은 지우거나 이름을 바꾸지 마세요.
  - 각 템플릿의 맨 바깥 요소는 하나만 있어야 합니다.
  =====================================================================
-->

<!-- 상태 화면: JS가 is-loading / is-empty / is-error 중 하나를 붙입니다. -->
<template data-template="status">
  <div class="status" data-js="status" role="status">
    <span class="status__icon" aria-hidden="true"></span>
    <p class="status__message" data-js="status-message"></p>
    <div class="status__actions">
      <a class="btn btn--primary btn--small" data-js="status-link" hidden></a>
      <button class="btn btn--secondary btn--small" type="button" data-js="status-retry" hidden>다시 시도</button>
    </div>
  </div>
</template>

<!-- 토스트 알림: JS가 is-success / is-error를 붙일 수 있습니다. -->
<template data-template="toast">
  <div class="toast" data-js="toast">
    <p class="toast__message" data-js="toast-message"></p>
    <a class="toast__action" data-js="toast-link" hidden></a>
    <button class="toast__close" type="button" data-js="toast-close" aria-label="알림 닫기">×</button>
  </div>
</template>

<!-- 모달 (dialog 요소) -->
<template data-template="modal">
  <dialog class="modal" data-js="modal">
    <div class="modal__panel">
      <div class="modal__header">
        <h2 class="modal__title" data-js="modal-title"></h2>
        <button class="modal__close" type="button" data-js="modal-close" aria-label="닫기">×</button>
      </div>
      <div class="modal__body" data-js="modal-body"></div>
    </div>
  </dialog>
</template>

<!-- 곡 카드: 추천 결과, 플레이리스트 상세, 내 평점에서 같이 씁니다.
     필요 없는 버튼(card-add / card-remove)은 JS가 페이지에 맞게 지웁니다. -->
<template data-template="track-card">
  <li class="card-grid__item">
    <article class="card">
      <img class="card__image" data-js="card-image" src="assets/default-album.svg" alt="" width="300" height="300" loading="lazy">
      <div class="card__body">
        <h3 class="card__title" data-js="card-title"></h3>
        <p class="card__subtitle" data-js="card-artist"></p>
        <p class="card__meta" data-js="card-meta" hidden></p>
        <p class="card__links">
          <a class="card__link" data-js="card-lastfm-link" target="_blank" rel="noopener noreferrer">Last.fm</a>
          <a class="card__link" data-js="card-youtube-link" target="_blank" rel="noopener noreferrer">YouTube에서 찾기</a>
        </p>
        <div class="card__rating" data-js="card-rating"></div>
        <div class="card__actions">
          <button class="btn btn--primary btn--small" type="button" data-js="card-add">플레이리스트에 추가</button>
          <button class="btn btn--secondary btn--small" type="button" data-js="card-remove">목록에서 빼기</button>
        </div>
      </div>
    </article>
  </li>
</template>

<!-- 곡 검색 자동완성 후보 한 줄: 키보드로 고르면 JS가 is-active를 붙입니다. -->
<template data-template="suggestion">
  <li class="suggestion" data-js="suggestion" role="option" aria-selected="false">
    <img class="suggestion__image" data-js="suggestion-image" src="assets/default-album.svg" alt="" width="40" height="40">
    <span class="suggestion__text">
      <span class="suggestion__title" data-js="suggestion-title"></span>
      <span class="suggestion__artist" data-js="suggestion-artist"></span>
    </span>
  </li>
</template>

<!-- 선택한 곡 칩 -->
<template data-template="chip">
  <li class="chip" data-js="chip">
    <span class="chip__label" data-js="chip-label"></span>
    <button class="chip__remove" type="button" data-js="chip-remove" aria-label="선택 취소">×</button>
  </li>
</template>

<!-- 별점: 별 5개 버튼 (data-score 1~5는 지우지 마세요)
     - 내 점수 이하의 별에 is-selected, 마우스를 올린 별까지 is-active
     - 평균 불러오는 중 is-loading, 저장 중 is-disabled -->
<template data-template="star-rating">
  <div class="star-rating" data-js="star-rating">
    <div class="star-rating__stars" role="group" data-js="star-group" aria-label="별점 주기">
      <button class="star-rating__star" type="button" data-js="star" data-score="1">★</button>
      <button class="star-rating__star" type="button" data-js="star" data-score="2">★</button>
      <button class="star-rating__star" type="button" data-js="star" data-score="3">★</button>
      <button class="star-rating__star" type="button" data-js="star" data-score="4">★</button>
      <button class="star-rating__star" type="button" data-js="star" data-score="5">★</button>
    </div>
    <p class="star-rating__summary">
      <span class="star-rating__mine" data-js="star-mine"></span>
      <span class="star-rating__average" data-js="star-average"></span>
    </p>
    <button class="star-rating__clear" type="button" data-js="star-clear" hidden>평점 삭제</button>
  </div>
</template>

<!-- 플레이리스트 카드 (내 플레이리스트 목록 페이지) -->
<template data-template="playlist-card">
  <li class="playlist-list__item">
    <a class="playlist-card" data-js="playlist-link" href="playlists.html">
      <span class="playlist-card__name" data-js="playlist-name"></span>
      <span class="playlist-card__meta" data-js="playlist-meta"></span>
    </a>
  </li>
</template>

<!-- "플레이리스트에 추가" 모달 안의 내용 -->
<template data-template="playlist-picker">
  <div class="picker" data-js="picker">
    <p class="picker__track" data-js="picker-track"></p>
    <div class="status-slot status-slot--compact" data-js="picker-status"></div>
    <ul class="picker__list" data-js="picker-list" aria-label="내 플레이리스트"></ul>
    <form class="picker__form form-row" data-js="picker-create-form" novalidate>
      <label class="field">
        <span class="field__label">새 플레이리스트 만들기</span>
        <input class="input" type="text" data-js="picker-create-input" maxlength="50" required placeholder="플레이리스트 이름">
      </label>
      <button class="btn btn--primary" type="submit" data-js="picker-create-submit">만들고 추가</button>
    </form>
  </div>
</template>

<!-- 위 모달 안의 플레이리스트 한 줄 -->
<template data-template="playlist-picker-item">
  <li class="picker__item">
    <button class="picker__button" type="button" data-js="picker-option">
      <span class="picker__name" data-js="picker-name"></span>
      <span class="picker__count" data-js="picker-count"></span>
    </button>
  </li>
</template>

<!-- 확인 모달의 버튼 영역 (예: 삭제 확인) -->
<template data-template="confirm-body">
  <div class="confirm">
    <p class="confirm__message" data-js="confirm-message"></p>
    <div class="modal__actions">
      <button class="btn btn--secondary" type="button" data-js="confirm-cancel">취소</button>
      <button class="btn btn--danger" type="button" data-js="confirm-ok">확인</button>
    </div>
  </div>
</template>
